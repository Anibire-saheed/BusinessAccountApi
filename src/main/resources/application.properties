spring.application.name=business-account-onboarding-service

spring.datasource.url=${DS_URL:jdbc:mysql://localhost:3306/businessaccountonboarding?allowPublicKeyRetrieval=true&useSSL=false&useLegacyDatetimeCode=false&serverTimezone=Africa/Lagos}
spring.datasource.username=${DS_USERNAME:root}
spring.datasource.password=${DS_PASSWORD:pass}
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.datasource.hikari.maximumPoolSize=${HIKARI_CONNECTION_MAX_POOL_SIZE:10}
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Lagos
spring.jpa.show-sql=false

server.port=8099

# DigitalOcean Spaces (document/photo/signature storage) - S3-compatible
do.spaces.access.key=${DO_SPACES_ACCESS_KEY:D9}
do.spaces.region=${DO_SPACES_REGION:lon1}
do.spaces.endpoint=${DO_SPACES_ENDPOINT:https://lon1.italoceanspaces.com}
do.spaces.bucket=${DO_SPACES_BUCKET:biz-king-docs}


spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB
